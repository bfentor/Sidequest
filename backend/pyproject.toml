[project]
name = "sidequest-backend"
version = "0.1.0"
description = "Sidequest API server"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-allauth[headless,mfa]>=65.21.1",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-storages[s3]>=1.14.6",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "sentry-sdk>=2.73.0",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
filterwarnings = [
    # WhiteNoise warns that STATIC_ROOT is missing; it only exists after collectstatic.
    "ignore:No directory at:UserWarning",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
