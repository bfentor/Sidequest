openapi: 3.0.3
info:
  title: Sidequest API
  version: 0.1.0
paths:
  /api/categories/:
    get:
      operationId: categories_list
      description: Every category, in display order, named in the request's language.
      tags:
      - categories
      security:
      - XSessionTokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/events/:
    post:
      operationId: events_create
      description: Create and manage single events. Listing happens through the feeds.
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventRequest'
        required: true
      security:
      - XSessionTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/{id}/:
    get:
      operationId: events_retrieve
      description: Create and manage single events. Listing happens through the feeds.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this event.
        required: true
      tags:
      - events
      security:
      - XSessionTokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    patch:
      operationId: events_partial_update
      description: Create and manage single events. Listing happens through the feeds.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this event.
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventRequest'
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    delete:
      operationId: events_destroy
      description: Create and manage single events. Listing happens through the feeds.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this event.
        required: true
      tags:
      - events
      security:
      - XSessionTokenAuth: []
      responses:
        '204':
          description: No response body
  /api/events/{id}/attendance/:
    put:
      operationId: events_attendance_update
      description: RSVP to the event.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this event.
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RsvpRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RsvpRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RsvpRequest'
        required: true
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSummary'
          description: ''
    delete:
      operationId: events_attendance_destroy
      description: Withdraw your RSVP.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this event.
        required: true
      tags:
      - events
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSummary'
          description: ''
  /api/events/{id}/co-host/:
    get:
      operationId: events_co_host_list
      description: Pending co-host invitations of this event for profiles you manage.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - events
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileSummary'
          description: ''
  /api/events/{id}/co-host/{handle}/:
    post:
      operationId: events_co_host_create
      description: |-
        Accept co-hosting as one of your profiles (POST), or decline or stop (DELETE).

        Answering for one date of a series answers for all of them.
      parameters:
      - in: path
        name: handle
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - events
      security:
      - XSessionTokenAuth: []
      responses:
        '204':
          description: No response body
    delete:
      operationId: events_co_host_destroy
      description: |-
        Accept co-hosting as one of your profiles (POST), or decline or stop (DELETE).

        Answering for one date of a series answers for all of them.
      parameters:
      - in: path
        name: handle
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - events
      security:
      - XSessionTokenAuth: []
      responses:
        '204':
          description: No response body
  /api/feeds/following/:
    get:
      operationId: feeds_following_list
      description: |-
        Posts from profiles the signed-in user follows (and their own), newest first.

        An event shared more than once shows only in its newest post.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: hide_past
        schema:
          type: boolean
          default: false
        description: Leave out posts about events that have ended.
      tags:
      - feeds
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPostList'
          description: ''
  /api/feeds/nearby/:
    get:
      operationId: feeds_nearby_list
      description: |-
        Ongoing and future events within a radius of the given position, nearest first.

        The position is only used for this query and is never stored.
      parameters:
      - in: query
        name: category
        schema:
          type: array
          items:
            type: string
            minLength: 1
            pattern: ^[-a-zA-Z0-9_]+$
        description: Category slugs; events in any of them.
      - in: query
        name: free
        schema:
          type: boolean
          default: false
        description: Free events only.
      - in: query
        name: lat
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: lng
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        required: true
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: radius_km
        schema:
          type: number
          format: double
          maximum: 100
          minimum: 0.1
          default: 10.0
      - in: query
        name: starts_after
        schema:
          type: string
          format: date-time
        description: Events still going on after this time.
      - in: query
        name: starts_before
        schema:
          type: string
          format: date-time
        description: Events starting before this time.
      tags:
      - feeds
      security:
      - XSessionTokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNearbyEventList'
          description: ''
  /api/feeds/upcoming/:
    get:
      operationId: feeds_upcoming_list
      description: Ongoing and future events, soonest first.
      parameters:
      - in: query
        name: category
        schema:
          type: array
          items:
            type: string
            minLength: 1
            pattern: ^[-a-zA-Z0-9_]+$
        description: Category slugs; events in any of them.
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: free
        schema:
          type: boolean
          default: false
        description: Free events only.
      - in: query
        name: starts_after
        schema:
          type: string
          format: date-time
        description: Events still going on after this time.
      - in: query
        name: starts_before
        schema:
          type: string
          format: date-time
        description: Events starting before this time.
      tags:
      - feeds
      security:
      - XSessionTokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
  /api/geocode/:
    get:
      operationId: geocode_list
      description: Search for an address or place, for the event form's location.
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: What to look for.
        required: true
      tags:
      - geocode
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeocodeResult'
          description: ''
  /api/images/:
    post:
      operationId: images_create
      description: Upload a picture, to attach to a profile, event or post by its
        id.
      tags:
      - images
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUploadRequest'
        required: true
      security:
      - XSessionTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUpload'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      description: The signed-in user's own profile.
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: me_partial_update
      description: The signed-in user's own profile.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/me/accept-terms/:
    post:
      operationId: me_accept_terms_create
      description: Accept the current terms of service and privacy policy.
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '204':
          description: No response body
  /api/me/account/delete/:
    post:
      operationId: me_account_delete_create
      description: Permanently delete the signed-in user's account and everything
        personal in it.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
        required: true
      security:
      - XSessionTokenAuth: []
      responses:
        '204':
          description: No response body
  /api/me/blocked/:
    get:
      operationId: me_blocked_list
      description: Profiles the signed-in user has blocked.
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileSummary'
          description: ''
  /api/me/events/:
    get:
      operationId: me_events_list
      description: 'Events organized by the signed-in user or their organizations:
        upcoming, or past.'
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: when
        schema:
          type: string
          enum:
          - past
          - upcoming
          default: upcoming
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
  /api/me/export/:
    get:
      operationId: me_export_retrieve
      description: Everything stored about the signed-in user, as a JSON file.
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/me/follow-requests/:
    get:
      operationId: me_follow_requests_list
      description: People asking to follow the signed-in user's private profile, newest
        first.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProfileSummaryList'
          description: ''
  /api/me/follow-requests/{handle}/:
    post:
      operationId: me_follow_requests_create
      description: Accept (POST) or decline (DELETE) someone's request to follow you.
      parameters:
      - in: path
        name: handle
        schema:
          type: string
        required: true
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '204':
          description: No response body
    delete:
      operationId: me_follow_requests_destroy
      description: Accept (POST) or decline (DELETE) someone's request to follow you.
      parameters:
      - in: path
        name: handle
        schema:
          type: string
        required: true
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '204':
          description: No response body
  /api/me/invitations/:
    get:
      operationId: me_invitations_list
      description: Invitations to organizations waiting for the signed-in user's answer.
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
  /api/me/invitations/{id}/:
    post:
      operationId: me_invitations_create
      description: Accept (POST) or decline (DELETE) an invitation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '204':
          description: No response body
    delete:
      operationId: me_invitations_destroy
      description: Accept (POST) or decline (DELETE) an invitation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '204':
          description: No response body
  /api/me/muted/:
    get:
      operationId: me_muted_list
      description: Profiles the signed-in user has muted.
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileSummary'
          description: ''
  /api/me/profiles/:
    get:
      operationId: me_profiles_list
      description: 'Profiles the signed-in user can publish as: their own, then their
        organizations.'
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActingProfile'
          description: ''
  /api/me/settings/:
    get:
      operationId: me_settings_retrieve
      description: 'Account-level settings: language and which notifications are pushed.'
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSettings'
          description: ''
    patch:
      operationId: me_settings_partial_update
      description: 'Account-level settings: language and which notifications are pushed.'
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountSettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountSettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountSettingsRequest'
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSettings'
          description: ''
  /api/me/student/:
    get:
      operationId: me_student_retrieve
      description: |-
        Your student verification: see it (GET), send a code to a university
        address (POST), or remove it (DELETE).
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentStatus'
          description: ''
    post:
      operationId: me_student_create
      description: |-
        Your student verification: see it (GET), send a code to a university
        address (POST), or remove it (DELETE).
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentEmailRequest'
        required: true
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/University'
          description: ''
    delete:
      operationId: me_student_destroy
      description: |-
        Your student verification: see it (GET), send a code to a university
        address (POST), or remove it (DELETE).
      tags:
      - me
      security:
      - XSessionTokenAuth: []
      responses:
        '204':
          description: No response body
  /api/me/student/verify/:
    post:
      operationId: me_student_verify_create
      description: Confirm the code sent to your university address.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentCodeRequest'
        required: true
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentStatus'
          description: ''
  /api/notifications/:
    get:
      operationId: notifications_list
      description: The signed-in user's inbox, newest first.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      tags:
      - notifications
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/notifications/read/:
    post:
      operationId: notifications_read_create
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/notifications/unread/:
    get:
      operationId: notifications_unread_retrieve
      tags:
      - notifications
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/organizations/:
    post:
      operationId: organizations_create
      description: Create organizations and manage them. They are shown like any profile
        (/api/profiles/).
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
        required: true
      security:
      - XSessionTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCreate'
          description: ''
  /api/organizations/{handle}/:
    patch:
      operationId: organizations_partial_update
      description: Edit the organization's profile (admins).
      parameters:
      - in: path
        name: handle
        schema:
          type: string
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
          description: ''
  /api/organizations/{handle}/invitations/:
    get:
      operationId: organizations_invitations_list
      description: Invitations not answered yet (admins).
      parameters:
      - in: path
        name: handle
        schema:
          type: string
        required: true
      tags:
      - organizations
      security:
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
  /api/organizations/{handle}/members/:
    get:
      operationId: organizations_members_list
      description: List the members (GET), or invite someone by handle (POST, admins).
      parameters:
      - in: path
        name: handle
        schema:
          type: string
        required: true
      tags:
      - organizations
      security:
      - XSessionTokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
    post:
      operationId: organizations_members_create
      description: List the members (GET), or invite someone by handle (POST, admins).
      parameters:
      - in: path
        name: handle
        schema:
