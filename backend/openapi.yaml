components:
  schemas:
    AccountSettings:
      type: object
      properties:
        email:
          type: string
          format: email
          readOnly: true
          description: 'Change it through allauth: /_allauth/app/v1/account/email.'
        language:
          $ref: '#/components/schemas/LanguageEnum'
        birth_date:
          type: string
          format: date
          description: Can only be added when missing (older accounts).
        terms_version:
          type: string
          readOnly: true
          description: The version you accepted.
        current_terms_version:
          type: string
          readOnly: true
        push:
          type: object
          additionalProperties:
            type: boolean
          description: Push on (true) or off (false), by notification kind. Missing
            kinds are on.
      required:
      - current_terms_version
      - email
      - terms_version
    ActingProfile:
      type: object
      description: Compact profile representation embedded in events and posts.
      properties:
        handle:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ProfileKindEnum'
          readOnly: true
        avatar:
          allOf:
          - $ref: '#/components/schemas/Image'
          readOnly: true
          nullable: true
        verified:
          type: boolean
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/ActingProfileRoleEnum'
          description: self for your own profile, otherwise your role in the organization.
          readOnly: true
      required:
      - avatar
      - display_name
      - handle
      - kind
      - role
      - verified
    ActingProfileRoleEnum:
      enum:
      - self
      - admin
      - editor
      type: string
    AttendanceStatusEnum:
      enum:
      - going
      - interested
      - waitlisted
      type: string
      description: |-
        * `going` - Going
        * `interested` - Interested
        * `waitlisted` - Waitlisted
    AttendanceSummary:
      type: object
      properties:
        going:
          type: integer
        interested:
          type: integer
        waitlisted:
          type: integer
        mine:
          nullable: true
          description: |-
            The signed-in user's RSVP, if any.

            * `going` - Going
            * `interested` - Interested
            * `waitlisted` - Waitlisted
          oneOf:
          - $ref: '#/components/schemas/AttendanceStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_full:
          type: boolean
      required:
      - going
      - interested
      - is_full
      - mine
      - waitlisted
    Category:
      type: object
      properties:
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
          description: In the request's language.
        icon:
          type: string
          readOnly: true
      required:
      - icon
      - name
      - slug
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        organizer:
          allOf:
          - $ref: '#/components/schemas/ProfileSummary'
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        venue_name:
          type: string
          maxLength: 200
        address:
          type: string
          maxLength: 300
        location:
          allOf:
          - $ref: '#/components/schemas/LatLng'
          nullable: true
        categories:
          type: array
          items:
            type: string
        capacity:
          type: integer
          minimum: 1
          nullable: true
        cover:
          allOf:
          - $ref: '#/components/schemas/Image'
          readOnly: true
          nullable: true
        online_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
          description: In euros; empty for free events.
        ticket_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        min_age:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        students_of:
          allOf:
          - $ref: '#/components/schemas/University'
          nullable: true
          readOnly: true
          description: Only verified students of this university can RSVP.
        visibility:
          $ref: '#/components/schemas/EventVisibilityEnum'
        status:
          $ref: '#/components/schemas/EventStatusEnum'
        published_at:
          type: string
          format: date-time
          nullable: true
          description: Leave out to publish now; empty for a draft; a future time
            to schedule.
        series_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        co_hosts:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSummary'
          readOnly: true
          description: Co-hosts who accepted.
        attendance:
          allOf:
          - $ref: '#/components/schemas/AttendanceSummary'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attendance
      - co_hosts
      - cover
      - created_at
      - ends_at
      - id
      - organizer
      - series_id
      - starts_at
      - students_of
      - title
      - updated_at
    EventRequest:
      type: object
      properties:
        organizer_handle:
          type: string
          minLength: 1
          writeOnly: true
          description: Publish as this profile (yourself or an organization you belong
            to). Defaults to your own profile. Only used on create.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        venue_name:
          type: string
          maxLength: 200
        address:
          type: string
          maxLength: 300
        location:
          allOf:
          - $ref: '#/components/schemas/LatLngRequest'
          nullable: true
        categories:
          type: array
          items:
            type: string
            minLength: 1
        capacity:
          type: integer
          minimum: 1
          nullable: true
        cover_id:
          type: integer
          writeOnly: true
          nullable: true
          description: An image uploaded with POST /api/images/.
        online_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
          description: In euros; empty for free events.
        ticket_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        min_age:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        students_of_id:
          type: integer
          writeOnly: true
          nullable: true
        visibility:
          $ref: '#/components/schemas/EventVisibilityEnum'
        status:
          $ref: '#/components/schemas/EventStatusEnum'
        published_at:
          type: string
          format: date-time
          nullable: true
          description: Leave out to publish now; empty for a draft; a future time
            to schedule.
        co_host_handles:
          type: array
          items:
            type: string
            minLength: 1
          writeOnly: true
          description: Profiles to ask to co-host; leaving one out removes it.
        repeat:
          allOf:
          - $ref: '#/components/schemas/RepeatRequest'
          writeOnly: true
          description: Create a series of dates. Only on create.
      required:
      - ends_at
      - starts_at
      - title
    EventStatusEnum:
      enum:
      - active
      - postponed
      - cancelled
      type: string
      description: |-
        * `active` - Active
        * `postponed` - Postponed
        * `cancelled` - Cancelled
    EventVisibilityEnum:
      enum:
      - public
      - followers
      - unlisted
      type: string
      description: |-
        * `public` - Public
        * `followers` - Followers
        * `unlisted` - Unlisted
    FollowStatus:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/FollowStatusStatusEnum'
          description: |-
            requested: the profile is private and has to accept you first.

            * `following` - following
            * `requested` - requested
            * `none` - none
      required:
      - status
    FollowStatusStatusEnum:
      enum:
      - following
      - requested
      - none
      type: string
      description: |-
        * `following` - following
        * `requested` - requested
        * `none` - none
    FrequencyEnum:
      enum:
      - weekly
      - biweekly
      - monthly
      type: string
      description: |-
        * `weekly` - weekly
        * `biweekly` - biweekly
        * `monthly` - monthly
    GeocodeResult:
      type: object
      properties:
        label:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
      required:
      - label
      - lat
      - lng
    Image:
      type: object
      description: How images appear inside other resources.
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          readOnly: true
        width:
          type: integer
          readOnly: true
        height:
          type: integer
          readOnly: true
      required:
      - height
      - id
      - url
      - width
    ImageUpload:
      type: object
      description: How images appear inside other resources.
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          readOnly: true
        width:
          type: integer
          readOnly: true
        height:
          type: integer
          readOnly: true
      required:
      - height
      - id
      - url
      - width
    ImageUploadRequest:
      type: object
      description: How images appear inside other resources.
      properties:
        file:
          type: string
          format: binary
          writeOnly: true
      required:
      - file
    Invitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        organization:
          allOf:
          - $ref: '#/components/schemas/ProfileSummary'
          readOnly: true
        invitee:
          allOf:
          - $ref: '#/components/schemas/ProfileSummary'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/MembershipRoleEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - invitee
      - organization
      - role
    InviteRequest:
      type: object
      properties:
        handle:
          type: string
          minLength: 1
          description: The person's handle.
        role:
          allOf:
          - $ref: '#/components/schemas/MembershipRoleEnum'
          default: editor
      required:
      - handle
    LanguageEnum:
      enum:
      - en
      - fi
      - sv
      type: string
      description: |-
        * `en` - English
        * `fi` - Suomi
        * `sv` - Svenska
    LatLng:
      type: object
      properties:
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
      required:
      - lat
      - lng
    LatLngRequest:
      type: object
      properties:
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
        lng:
