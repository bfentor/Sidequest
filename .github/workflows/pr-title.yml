name: Pull request title

# Pull requests are squash-merged, so their title becomes the commit message
# that release-please reads. It must follow Conventional Commits, e.g.
# "feat(events): RSVP buttons" or "fix: crash on sign out".

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
