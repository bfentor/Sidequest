name: CI

on:
  push:
    branches: [testing, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: sidequest
          POSTGRES_PASSWORD: sidequest
          POSTGRES_DB: sidequest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidequest"
          --health-interval 2s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci
      DATABASE_URL: postgis://sidequest:sidequest@localhost:5432/sidequest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest
      - name: OpenAPI schema is up to date
        run: |
          uv run python manage.py spectacular --file openapi.yaml --validate
          git diff --exit-code openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated API client is up to date
        run: |
          npm run api:generate
          git diff --exit-code packages/api/src/generated
      - run: npm run typecheck
      - run: npm run lint
