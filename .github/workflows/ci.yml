name: CI

# Checks pull requests. Shipping to testing doesn't wait for it: Coolify
# deploys staging by itself when testing changes (DEPLOYMENT.md).
on:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: sidequest
          POSTGRES_PASSWORD: sidequest
          POSTGRES_DB: sidequest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidequest"
          --health-interval 2s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci
      DATABASE_URL: postgis://sidequest:sidequest@localhost:5432/sidequest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin gettext
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py compilemessages --ignore=.venv
      - run: uv run pytest
      - name: OpenAPI schema is up to date
        run: |
          uv run python manage.py spectacular --file openapi.yaml --validate
          git diff --exit-code openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated API client is up to date
        run: |
          npm run api:generate
          git diff --exit-code packages/api/src/generated
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: sidequest
          POSTGRES_PASSWORD: sidequest
          POSTGRES_DB: sidequest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidequest"
          --health-interval 2s
          --health-retries 30
    env:
      DJANGO_SECRET_KEY: ci
      DJANGO_DEBUG: '1'
      DATABASE_URL: postgis://sidequest:sidequest@localhost:5432/sidequest
      DJANGO_ALLOWED_HOSTS: localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      EXPO_PUBLIC_API_URL: http://localhost:8000
      EXPO_PUBLIC_WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin gettext
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: API with demo data
        working-directory: backend
        run: |
          uv sync --locked
          uv run python manage.py migrate
          uv run python manage.py compilemessages --ignore=.venv
          uv run python manage.py seed_demo
          # The project's Python directly: a uv process left running would hold uv's cache lock,
          # and setup-uv's clean-up at the end of the job would wait for it and fail.
          .venv/bin/python manage.py runserver 8000 --noreload > ../api.log 2>&1 &
      - run: npm ci
      - name: Web app, built and served as in production
        run: |
          (cd apps/app && npx expo export --platform web)
          PORT=3000 node apps/web-server/server.js > web.log 2>&1 &
          for url in http://localhost:3000/healthz http://localhost:8000/api/feeds/upcoming/; do
            curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors --output /dev/null "$url"
          done
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            api.log
            web.log
