# Local development: `docker compose up` runs PostGIS, the API and the web app
# from their production images. Or run only the database (`docker compose up db`)
# and the rest on your machine (README.md).
services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: sidequest
      POSTGRES_PASSWORD: sidequest
      POSTGRES_DB: sidequest
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres.
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sidequest']
      interval: 2s
      retries: 30

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: dev-only-not-secret
      DJANGO_DEBUG: 'true'
      # Any host, so phones on your network can reach the dev server.
      DJANGO_ALLOWED_HOSTS: '*'
      DATABASE_URL: postgis://sidequest:sidequest@db:5432/sidequest
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:3000
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web-server/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: http://localhost:8000
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  db-data:
